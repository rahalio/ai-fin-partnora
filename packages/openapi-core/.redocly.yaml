apis:
  identity:
    root: src/identity.yaml
  partners:
    root: src/partners.yaml
  opportunities:
    root: src/opportunities.yaml
  deals:
    root: src/deals.yaml
  gates:
    root: src/gates.yaml
  channels:
    root: src/channels.yaml
  conflicts:
    root: src/conflicts.yaml
  ownership:
    root: src/ownership.yaml
  datapurpose:
    root: src/datapurpose.yaml
  economics:
    root: src/economics.yaml
  pilots:
    root: src/pilots.yaml
  audits:
    root: src/audits.yaml

extends:
  - recommended

rules:
  no-unused-components: off
  operation-4xx-response: warn
  info-license: off
  info-license-url: off
  tag-description: off
  operation-operationId: error
  no-invalid-media-type-examples: off

theme:
  openapi:
    generateCodeSamples:
      languages: []
