openapi: 3.1.0
info:
  title: Partners API schemas
  version: 0.1.0
  description: |
    Partner registry and regulatory postures (BR-1).
paths: {}
components:
  schemas:

    PartnerId:
      type: string
      pattern: '^ptn_[0-9A-HJKMNP-TV-Z]{26}$'

    RegulatoryPosture:
      type: string
      enum: [bank, paymentsBank, smallFinanceBank, nbfc, fintech, bc, ngo, merchant]

    Partner:
      type: object
      required: [partnerId, name, posture, createdAt, updatedAt]
      properties:
        partnerId:
          $ref: '#/components/schemas/PartnerId'
        name:
          type: string
          minLength: 1
          maxLength: 200
        posture:
          $ref: '#/components/schemas/RegulatoryPosture'
        prohibitedActivities:
          type: array
          items: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    PartnerCreateRequest:
      type: object
      required: [name, posture]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        posture:
          $ref: '#/components/schemas/RegulatoryPosture'
        prohibitedActivities:
          type: array
          items: { type: string }

    UpdatePartnerRequest:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        prohibitedActivities:
          type: array
          items: { type: string }

    PartnerListData:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Partner'
        nextCursor:
          type: string

    PartnerResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Partner'
        meta:
          $ref: ./common/envelopes.yaml#/components/schemas/ResponseMeta

    PartnerListResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/PartnerListData'
        meta:
          $ref: ./common/envelopes.yaml#/components/schemas/ResponseMeta


