openapi: 3.1.0
info:
  title: Economics API
  version: 0.1.0
  description: |
    PB-aware unit economics snapshots (BR-9).
  license:
    name: Proprietary
    url: https://partnora.local/license
  x-domain: eco
servers:
  - url: https://api.partnora.local
    description: Local / Partnora API
security:
  - apiKey: []
tags:
  - name: Economics
    description: Unit economics snapshots
paths:

  /v1/economics:
    get:
      operationId: listEconomicsSnapshots
      tags: [Economics]
      summary: List economics snapshots

      parameters:
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }

        - name: dealId
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Snapshots
          content:
            application/json:
              schema:
                $ref: ./economics.schemas.yaml#/components/schemas/EconomicsSnapshotListResponse
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem
    post:
      operationId: createEconomicsSnapshot
      tags: [Economics]
      summary: Close a monthly economics snapshot
      parameters:
        - $ref: ./common/parameters.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./economics.schemas.yaml#/components/schemas/EconomicsSnapshotCreateRequest
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: ./economics.schemas.yaml#/components/schemas/EconomicsSnapshotResponse

        '400':
          $ref: ./common/responses.yaml#/components/responses/BadRequest
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        '404':
          $ref: ./common/responses.yaml#/components/responses/NotFound
        '409':
          $ref: ./common/responses.yaml#/components/responses/Conflict
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem

  /v1/economics/{economicsSnapshotId}:
    get:
      operationId: getEconomicsSnapshot
      tags: [Economics]
      summary: Get economics snapshot
      parameters:
        - name: economicsSnapshotId
          in: path
          required: true
          schema:
            $ref: ./economics.schemas.yaml#/components/schemas/EconomicsSnapshotId
      responses:
        '200':
          description: Snapshot
          content:
            application/json:
              schema:
                $ref: ./economics.schemas.yaml#/components/schemas/EconomicsSnapshotResponse
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        '404':
          $ref: ./common/responses.yaml#/components/responses/NotFound
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem

components:
  securitySchemes:
    apiKey:
      $ref: ./common/security.yaml#/components/securitySchemes/apiKey
